name: Bug report
description: Something renders wrong, crashes or doesn't download.
labels: ["bug"]
body:
  - type: input
    id: link
    attributes:
      label: Link
      description: The studio share link, /s/<seed> or /u/<username> page where it happens.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: e.g. Safari 19 on iPhone 16, Chrome on macOS
